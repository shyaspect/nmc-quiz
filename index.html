<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="description" content="NMC CBT Adult Nursing Quiz — Practice questions for the NMC Test of Competence"/>
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)"/>
<title>NMC CBT Adult Nursing Quiz</title>
<style>
:root{
  --bg:#0f172a;--bg2:#162032;--bg3:#1e293b;
  --border:#1e293b;--border2:#334155;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#0ea5e9;--accent2:#6366f1;
  --amber:#f59e0b;--red:#dc2626;--green:#16a34a;
  --correct:#16a34a;--wrong:#dc2626;
  --radius:10px;--radius2:14px;
  --shadow:0 4px 20px rgba(14,165,233,0.25);
  --min-touch:44px;
}
[data-theme="light"]{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --accent:#0284c7;--accent2:#4f46e5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:Georgia,'Times New Roman',serif;
  min-height:100vh;line-height:1.5;
  transition:background 0.3s,color 0.3s;
}
#app{max-width:720px;margin:0 auto;padding-bottom:60px;}
*:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px;}
.hdr{
  background:rgba(0,0,0,0.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
[data-theme="light"] .hdr{background:rgba(248,250,252,0.9);}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-text .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
.hdr-text .title{font-size:16px;font-weight:bold;color:var(--text);}
.hdr-actions{display:flex;align-items:center;gap:8px;}
button{cursor:pointer;font-family:inherit;transition:all 0.15s;}
.btn{
  min-height:var(--min-touch);min-width:var(--min-touch);
  padding:10px 18px;border-radius:var(--radius);border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--text);}
.btn-icon{
  min-height:var(--min-touch);min-width:var(--min-touch);
  padding:8px;border-radius:var(--radius);border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);font-size:18px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn-icon:hover,.btn-icon:focus-visible{border-color:var(--accent);color:var(--text);}
.btn-primary{
  min-height:var(--min-touch);padding:14px 28px;border-radius:var(--radius);border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:16px;font-weight:bold;box-shadow:var(--shadow);
  display:block;width:100%;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(14,165,233,0.4);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-amber{background:linear-gradient(135deg,var(--amber),#ef4444);box-shadow:0 4px 20px rgba(245,158,11,0.3);}
.content{padding:18px 16px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;margin-bottom:14px;}
.slabel{font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}
.home-hero{text-align:center;padding:24px 16px 16px;}
.home-title{font-size:clamp(20px,5vw,28px);font-weight:bold;color:var(--text);margin-bottom:8px;}
.home-sub{font-size:14px;color:var(--text2);line-height:1.6;}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.mc{
  border-radius:var(--radius2);padding:22px 16px;cursor:pointer;
  border:2px solid var(--border2);background:var(--bg2);text-align:center;
  transition:all 0.2s;min-height:var(--min-touch);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.mc:hover,.mc:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);}
.mc-icon{font-size:32px;margin-bottom:10px;}
.mc-title{font-size:15px;font-weight:bold;margin-bottom:5px;}
.mc-desc{font-size:12px;color:var(--text2);line-height:1.5;}
.mc-badge{font-size:11px;margin-top:8px;padding:3px 12px;border-radius:20px;display:inline-block;}
.mc-b{border-color:var(--accent);}
.mc-b .mc-title{color:var(--accent);}
.mc-b .mc-badge{background:rgba(14,165,233,0.15);color:var(--accent);}
.mc-a{border-color:var(--amber);}
.mc-a .mc-title{color:var(--amber);}
.mc-a .mc-badge{background:rgba(245,158,11,0.15);color:var(--amber);}
.ppills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pi{
  padding:10px 12px;border-radius:var(--radius);cursor:pointer;
  display:flex;align-items:center;gap:10px;border:1.5px solid var(--border2);
  background:var(--bg);transition:all 0.15s;min-height:var(--min-touch);
}
.pi:hover,.pi:focus-visible{border-color:var(--accent);}
.pchk{width:20px;height:20px;border-radius:4px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff;}
.plbl{font-size:12px;color:var(--text2);}
.plbl strong{display:block;font-size:11px;}
.mrow{display:flex;gap:10px;}
.mbtn{
  flex:1;padding:12px;border-radius:var(--radius);cursor:pointer;text-align:center;
  border:1.5px solid var(--border2);background:var(--bg);font-family:inherit;
  font-size:14px;color:var(--text3);transition:all 0.15s;min-height:var(--min-touch);
}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--accent);color:var(--text);}
.crow{display:flex;gap:8px;flex-wrap:wrap;}
.cbtn{
  padding:10px 18px;border-radius:var(--radius);border:1.5px solid var(--border2);
  background:var(--bg);font-size:14px;font-family:inherit;cursor:pointer;
  color:var(--text3);min-height:var(--min-touch);transition:all 0.15s;
}
.cbtn:disabled{color:var(--border2);cursor:not-allowed;}
.anote{font-size:12px;color:var(--text3);margin-top:10px;}
.pmeta{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--text3);}
.schi{color:var(--accent);font-weight:bold;}
.pbar{height:5px;background:var(--border);border-radius:3px;margin-bottom:18px;}
.pfill-b{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s;}
.pfill-a{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),#ef4444);transition:width 0.4s;}
.qtags{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-block;}
.qtext{font-size:clamp(14px,3.5vw,16px);line-height:1.75;color:var(--text);}
.opt{
  width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius);
  border:1.5px solid var(--border2);background:var(--bg2);color:var(--text2);
  font-family:inherit;font-size:clamp(13px,3.5vw,15px);cursor:pointer;
  display:block;margin-bottom:10px;line-height:1.5;
  transition:border-color 0.15s,background 0.15s,color 0.15s;min-height:var(--min-touch);
}
.opt:hover:not(:disabled){border-color:var(--accent);background:rgba(14,165,233,0.07);color:var(--text);}
.opt.cor{border-color:var(--correct)!important;background:rgba(22,163,74,0.1)!important;color:#86efac!important;}
.opt.wrg{border-color:var(--wrong)!important;background:rgba(220,38,38,0.1)!important;color:#fca5a5!important;}
.opt.dim{border-color:var(--border);background:var(--bg);color:var(--text3);}
.oltr{font-weight:bold;margin-right:10px;opacity:0.5;}
.otick{float:right;font-size:16px;}
.nbox{background:var(--bg2);border:2px solid rgba(245,158,11,0.3);border-radius:var(--radius2);padding:22px;margin-bottom:18px;}
.ninrow{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap;}
.ninput{
  flex:1;min-width:120px;padding:14px;border-radius:var(--radius);
  border:2px solid var(--border2);background:var(--bg);color:var(--text);
  font-size:clamp(18px,5vw,24px);font-family:inherit;text-align:center;
  outline:none;transition:border-color 0.15s;min-height:var(--min-touch);
}
.ninput:focus{border-color:var(--amber);}
.ninput.ncor{border-color:var(--correct);background:rgba(22,163,74,0.08);color:#86efac;}
.ninput.nwrg{border-color:var(--wrong);background:rgba(220,38,38,0.08);color:#fca5a5;}
.nunit{font-size:15px;color:var(--text2);white-space:nowrap;}
.expbox{border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.explbl{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.exptxt{font-size:14px;line-height:1.7;color:var(--text2);}
.rpc{font-size:clamp(52px,15vw,68px);font-weight:bold;line-height:1;}
.rsub{font-size:16px;color:var(--text2);margin-top:8px;}
.rmsg{font-size:14px;margin-top:10px;}
.prw{margin-bottom:12px;}
.prmeta{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;color:var(--text2);}
.prbg{height:5px;background:var(--border);border-radius:3px;}
.prfill{height:100%;border-radius:3px;transition:width 0.6s;}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.btnout{
  background:var(--bg2);border:1px solid var(--border2);color:var(--text2);
  padding:12px 24px;border-radius:var(--radius);font-size:15px;
  font-family:inherit;min-height:var(--min-touch);
}
.btnout:hover,.btnout:focus-visible{border-color:var(--accent);color:var(--text);}
.frow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.fbtn{
  background:var(--bg2);border:1px solid var(--border2);color:var(--text3);
  padding:9px 16px;border-radius:var(--radius);font-size:13px;
  font-family:inherit;min-height:var(--min-touch);
}
.fbtn.on{border-color:var(--accent);color:var(--accent);}
.rnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.rcnt{font-size:13px;color:var(--text3);}
.rbtns{display:flex;gap:8px;}
.noq{text-align:center;color:var(--text3);padding:40px 0;}
.ropt{padding:12px 14px;border-radius:var(--radius);border:1.5px solid var(--border2);background:var(--bg);font-size:14px;margin-bottom:8px;line-height:1.5;}
.qnav-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;padding-bottom:6px;}
.qnav-track{display:flex;gap:7px;padding:2px 2px 4px;width:max-content;min-width:100%;}
.qnav-btn{
  width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:bold;
  font-family:inherit;border:2px solid var(--border2);background:transparent;
  color:var(--text3);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:all 0.15s;
}
.qnav-btn:hover{border-color:var(--accent);color:var(--accent);}
.qnav-btn.qn-answered-b{background:var(--accent);border-color:var(--accent);color:#fff;}
.qnav-btn.qn-answered-a{background:var(--amber);border-color:var(--amber);color:#fff;}
.qnav-btn.qn-current{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent);color:var(--accent);}
.qnav-btn.qn-current.qn-answered-b{color:#fff;}
.qnav-btn.qn-current.qn-answered-a{outline-color:var(--amber);color:#fff;}
.qnav-btn.qn-flagged{border-color:#f59e0b;}
.qnav-btn.qn-flagged::after{
  content:"⚑";font-size:8px;color:#f59e0b;position:absolute;top:-4px;right:-4px;
  background:var(--bg);border-radius:50%;width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.qnav-btn.qn-skipped{border-style:dashed;color:var(--text3);}
.quiz-nav-bar{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap;}
.quiz-nav-bar .btn-prev{
  background:var(--bg2);border:1.5px solid var(--border2);color:var(--text2);
  padding:12px 20px;border-radius:var(--radius);font-size:15px;font-family:inherit;
  min-height:var(--min-touch);flex-shrink:0;
}
.quiz-nav-bar .btn-prev:disabled{opacity:0.35;cursor:not-allowed;}
.quiz-nav-bar .btn-prev:not(:disabled):hover{border-color:var(--accent);color:var(--text);}
.quiz-nav-bar .btn-flag{
  background:var(--bg2);border:1.5px solid var(--border2);color:var(--text3);
  padding:12px 16px;border-radius:var(--radius);font-size:15px;font-family:inherit;
  min-height:var(--min-touch);flex-shrink:0;
}
.quiz-nav-bar .btn-flag.flagged{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,0.1);}
.quiz-nav-bar .btn-next-b{
  flex:1;padding:12px 20px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:15px;font-weight:bold;font-family:inherit;min-height:var(--min-touch);
}
.quiz-nav-bar .btn-next-a{
  flex:1;padding:12px 20px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--amber),#ef4444);
  color:#fff;font-size:15px;font-weight:bold;font-family:inherit;min-height:var(--min-touch);
}
.quiz-nav-bar button:not(:disabled):hover{opacity:0.9;transform:translateY(-1px);}
.exam-wrap{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.15);margin-bottom:16px;font-family:Arial,Helvetica,sans-serif;}
[data-theme="light"] .exam-wrap{box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.exam-topbar{background:#2e4a8b;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;flex-wrap:wrap;gap:4px;}
.exam-topbar-left{font-weight:bold;font-size:14px;color:#fff;}
.exam-topbar-right{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:#cde;}
.exam-tools{background:#3d5a9e;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a3f7a;}
.exam-calc-btn{background:none;border:1px solid #8ab;color:#cde;padding:4px 10px;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:default;}
.exam-flag{background:none;border:none;color:#cde;font-size:12px;display:flex;align-items:center;gap:5px;cursor:default;}
.exam-body{padding:18px 16px;color:#1a1a1a;background:#fff;}
.exam-qtext{font-size:15px;line-height:1.7;color:#1a1a1a;margin-bottom:18px;white-space:pre-line;}
.exam-visual{margin:16px 0 20px;display:flex;justify-content:flex-start;width:100%;max-width:100%;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.exam-visual svg{max-width:100%;height:auto;display:block;}
.exam-input-row{display:flex;align-items:center;gap:10px;margin-top:8px;width:100%;flex-wrap:wrap;}
.exam-input{
  flex:1 1 auto;min-width:100px;padding:8px 12px;border:2px solid #aaa;border-radius:6px;
  font-size:18px;font-family:Arial,sans-serif;background:#fff;color:#000;outline:none;height:44px;
}
.exam-input:focus{border-color:#2e4a8b;box-shadow:0 0 0 2px rgba(46,74,139,0.2);}
.exam-input.ncor{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;}
.exam-input.nwrg{background:#ffebee;border-color:#c62828;color:#b71c1c;}
.exam-input-unit{background:#e8ecf4;border:2px solid #aaa;padding:8px 12px;font-size:15px;color:#333;height:44px;display:flex;align-items:center;white-space:nowrap;border-radius:6px;}
.exam-submit{background:#2e4a8b;color:#fff;border:none;padding:8px 24px;font-size:16px;font-weight:bold;font-family:Arial,sans-serif;cursor:pointer;height:44px;border-radius:6px;flex:1 1 100%;min-width:120px;}
.exam-submit:hover{background:#1e3a7b;}
.rx-wrap{width:100%;max-width:100%;overflow-x:auto;border:1px solid #bbb;border-radius:4px;display:block;-webkit-overflow-scrolling:touch;}
.rx-title{font-size:12px;font-weight:bold;color:#1a1a1a;margin-bottom:4px;}
.rx-table{width:100%;border-collapse:collapse;font-size:12px;min-width:450px;}
.rx-table th{background:#e0e0e0;border-bottom:1px solid #bbb;border-right:1px solid #bbb;padding:8px;text-align:left;font-weight:bold;color:#22;}
.rx-table td{border-bottom:1px solid #bbb;border-right:1px solid #bbb;padding:8px;background:#fff;color:#1a1a1a;}
.med-label-box{width:110px;border:2px solid #888;border-radius:4px;overflow:hidden;background:#fff;box-shadow:1px 2px 6px rgba(0,0,0,0.15);}
.med-label-header{padding:5px 8px;font-size:11px;font-weight:bold;color:#fff;text-align:center;line-height:1.3;}
.med-label-body{background:#fff;padding:5px 8px;font-size:10px;color:#333;text-align:center;border-top:1px solid #ccc;}
.ampoule-box{width:150px;border:2px solid #999;border-radius:6px;overflow:hidden;background:#fff;box-shadow:1px 2px 6px rgba(0,0,0,0.12);}
.ampoule-top{height:6px;border-radius:0;}
.ampoule-label{padding:8px 10px;text-align:left;}
.ampoule-drug{font-size:12px;font-weight:bold;color:#1a1a1a;margin-bottom:3px;line-height:1.3;}
.ampoule-conc{font-size:11px;color:#444;}
.ampoule-icon{display:flex;justify-content:center;padding:6px 10px 8px;}
.conv-wrap{display:flex;align-items:center;gap:12px;padding:12px 0;}
.conv-box{background:#e8ecf4;border:2px solid #2e4a8b;border-radius:8px;padding:12px 20px;font-size:18px;font-weight:bold;color:#1a1a1a;min-width:100px;text-align:center;}
.conv-arrow{font-size:22px;color:#2e4a8b;font-weight:bold;}
.conv-rule{font-size:13px;color:#555;text-align:center;margin-top:4px;}
.tablet-box{background:#fff;border:2px solid #888;border-radius:6px;padding:10px 14px;min-width:140px;box-shadow:1px 2px 6px rgba(0,0,0,0.12);}
.tablet-name{font-size:13px;font-weight:bold;color:#1a1a1a;margin-bottom:4px;}
.tablet-strength{font-size:12px;color:#444;}
.sd-wrap{background:#f0f4fa;border:2px solid #2e4a8b;border-radius:8px;padding:12px 16px;min-width:200px;}
.sd-title{font-size:11px;color:#2e4a8b;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.sd-drug{font-size:13px;font-weight:bold;color:#1a1a1a;margin-bottom:2px;}
.sd-total{font-size:12px;color:#555;}
.footer{text-align:center;font-size:11px;color:var(--text3);padding:20px 0 10px;}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:var(--radius);font-size:14px;z-index:1000;transition:top 0.2s;text-decoration:none;}
.skip-link:focus{top:8px;}
@media(max-width:440px){
  .pgrid,.mode-cards{grid-template-columns:1fr;}
  .hdr-text .title{font-size:14px;}
  .content{padding:14px 12px;}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn 0.25s ease;}
</style>
</head>

function prepareMCQ(raw){
  return raw.map(function(q){
    var opts=q.options.slice();
    var correctText=opts[q.answer];
    for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
    return {id:q.id,platform:q.platform,hard:q.hard,q:q.q,options:opts,answer:opts.indexOf(correctText),explanation:q.explanation};
  });
}

// ── SUBMIT NUMERIC ────────────────────────────────
function submitNumeric(){
  var q=S.numActive[S.numIdx];
  if(!q||S.numAnswers[q.id]!==undefined) return;
  var ni=document.getElementById("numinput");
  if(!ni||!ni.value.trim()) return;
  var given=ni.value.trim();
  var norm=normAns(given);
  var correct=false;
  var accepts=q.accept||[q.answer];
  for(var i=0;i<accepts.length;i++){if(normAns(String(accepts[i]))===norm){correct=true;break;}}
  if(!correct){var nv=parseFloat(given),na=parseFloat(q.answer);if(!isNaN(nv)&&!isNaN(na)&&Math.abs(nv-na)<0.06)correct=true;}
  S.numAnswers[q.id]={given:given,correct:correct};
  render();
}

// ── EVENTS ────────────────────────────────────────
function bindEvents(){
  var app=document.getElementById("app");
  var ni=document.getElementById("numinput");
  if(ni) setTimeout(function(){ni.focus();},150);

  app.onkeydown=function(e){
    if(e.key==="Enter"){var ni2=document.getElementById("numinput");if(ni2&&!ni2.disabled){e.preventDefault();submitNumeric();}}
    if(e.key===" "&&e.target.dataset.togglep){e.preventDefault();e.target.click();}
  };

  app.onclick=function(e){
    var el=e.target;
    while(el&&el.id!=="app"){
      var d=el.dataset||{};
      if(d.toggletheme){toggleTheme();return;}
      if(d.togglelang){toggleLang();return;}
      if(d.go){S.screen=d.go;render();return;}
      if(d.togglep){
        var p=parseInt(d.togglep);
        var idx=S.mcqSelPlat.indexOf(p);
        if(idx>-1)S.mcqSelPlat.splice(idx,1);else S.mcqSelPlat.push(p);
        S.mcqSelPlat.sort();render();return;
      }
      if(d.mcqhard!==undefined){S.mcqHard=d.mcqhard==="1";render();return;}
      if(d.mcqcount){S.mcqCount=parseInt(d.mcqcount);render();return;}
      if(d.startmcq){
        var pool=mcqRaw.filter(function(q){return S.mcqSelPlat.indexOf(q.platform)>-1&&(!S.mcqHard||q.hard);});
        S.mcqActive=prepareMCQ(shuffle(pool).slice(0,Math.min(S.mcqCount,pool.length)));
        S.mcqIdx=0;S.mcqAnswers={};S.mcqShowExp=false;S.mcqFlagged={};
        S.screen="mcq-quiz";render();return;
      }
      if(d.mcqans!==undefined){
        var q2=S.mcqActive[S.mcqIdx];
        if(q2&&!S.mcqAnswers.hasOwnProperty(q2.id)){S.mcqAnswers[q2.id]=parseInt(d.mcqans);S.mcqShowExp=true;render();}
        return;
      }
      if(d.mcqprev!==undefined){if(S.mcqIdx>0){S.mcqIdx--;S.mcqShowExp=S.mcqAnswers.hasOwnProperty(S.mcqActive[S.mcqIdx].id);render();}return;}
      if(d.mcqnext!==undefined){
        var isLast=S.mcqIdx===S.mcqActive.length-1;
        if(isLast){
          var un=S.mcqActive.length-Object.keys(S.mcqAnswers).length;
          if(un>0&&!confirm("You have "+un+" unanswered question"+(un===1?"":"s")+". Finish the test?"))return;
          S.screen="mcq-results";
        }else{S.mcqIdx++;S.mcqShowExp=S.mcqAnswers.hasOwnProperty(S.mcqActive[S.mcqIdx].id);}
        render();return;
      }
      if(d.mcqflag!==undefined){var fq=S.mcqActive[S.mcqIdx];if(fq){if(S.mcqFlagged[fq.id])delete S.mcqFlagged[fq.id];else S.mcqFlagged[fq.id]=true;}render();return;}
      if(d.mcqjump!==undefined){S.mcqIdx=parseInt(d.mcqjump);S.mcqShowExp=S.mcqAnswers.hasOwnProperty(S.mcqActive[S.mcqIdx].id);render();return;}
      if(d.mcqfilt){S.mcqRevFilter=d.mcqfilt;S.mcqRevIdx=0;render();return;}
      if(d.mcqrevnext){
        var l=S.mcqRevFilter==="correct"?S.mcqActive.filter(function(q){return S.mcqAnswers[q.id]===q.answer;}):S.mcqRevFilter==="wrong"?S.mcqActive.filter(function(q){return S.mcqAnswers[q.id]!==q.answer;}):S.mcqActive;
        S.mcqRevIdx=Math.min(S.mcqRevIdx+1,l.length-1);render();return;
      }
      if(d.mcqrevprev){S.mcqRevIdx=Math.max(S.mcqRevIdx-1,0);render();return;}
      if(d.numcount){S.numCount=parseInt(d.numcount);render();return;}
      if(d.startnum){
        S.numActive=shuffle(numericQs).slice(0,Math.min(S.numCount,numericQs.length));
        S.numIdx=0;S.numAnswers={};S.numFlagged={};S.screen="num-quiz";render();return;
      }
      if(d.numsub){submitNumeric();return;}
      if(d.numprev!==undefined){if(S.numIdx>0){S.numIdx--;render();}return;}
      if(d.numnext!==undefined){
        var isLastN=S.numIdx===S.numActive.length-1;
        if(isLastN){
          var unN=S.numActive.length-Object.keys(S.numAnswers).length;
          if(unN>0&&!confirm("You have "+unN+" unanswered question"+(unN===1?"":"s")+". Finish the test?"))return;
          S.screen="num-results";
        }else S.numIdx++;
        render();return;
      }
      if(d.numflag!==undefined){var fnq=S.numActive[S.numIdx];if(fnq){if(S.numFlagged[fnq.id])delete S.numFlagged[fnq.id];else S.numFlagged[fnq.id]=true;}render();return;}
      if(d.numjump!==undefined){S.numIdx=parseInt(d.numjump);render();return;}
      if(d.numfilt){S.numRevFilter=d.numfilt;S.numRevIdx=0;render();return;}
      if(d.numrevnext){
        var ln=S.numRevFilter==="correct"?S.numActive.filter(function(q){return S.numAnswers[q.id]&&S.numAnswers[q.id].correct;}):S.numRevFilter==="wrong"?S.numActive.filter(function(q){return S.numAnswers[q.id]&&!S.numAnswers[q.id].correct;}):S.numActive;
        S.numRevIdx=Math.min(S.numRevIdx+1,ln.length-1);render();return;
      }
      if(d.numrevprev){S.numRevIdx=Math.max(S.numRevIdx-1,0);render();return;}
      el=el.parentElement;
    }
  };
}

// ── THEME / LANG ──────────────────────────────────
function toggleTheme(){
  var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("nmc-theme",next);}catch(e){}
}
function toggleLang(){
  locale=locale==="en"?"fr":"en";
  try{localStorage.setItem("nmc-lang",locale);}catch(e){}
  render();
}

// ── RESTORE PREFERENCES ───────────────────────────
(function(){
  try{
    var th=localStorage.getItem("nmc-theme");
    if(th)document.documentElement.setAttribute("data-theme",th);
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:light)").matches)document.documentElement.setAttribute("data-theme","light");
    var lang=localStorage.getItem("nmc-lang");
    if(lang)locale=lang;
  }catch(e){}
})();
